<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>My Journey — Ulrich Mohrhardt Doger</title>
  <meta name="description" content="Two years at UWC Costa Rica, left on a desk in photos. From Tehuacán, Puebla." />
  <meta name="theme-color" content="#1c120b" />
  <meta property="og:title" content="My Journey — Ulrich Mohrhardt Doger" />
  <meta property="og:description" content="From Tehuacán, Puebla to UWC Costa Rica, in photos." />
  <meta property="og:image" content="photos/cover/portrait.webp" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='12' width='60' height='40' rx='6' fill='%23e9ecf2'/%3E%3Crect x='12' y='24' width='40' height='14' rx='7' fill='%231d2456'/%3E%3Ccircle cx='21' cy='31' r='5' fill='%23cfd4de'/%3E%3Ccircle cx='43' cy='31' r='5' fill='%23cfd4de'/%3E%3Crect x='16' y='44' width='32' height='4' fill='%23c8102e'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Gochi+Hand&family=Playfair+Display:ital,wght@0,900;1,500&family=Special+Elite&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preload" as="image" href="photos/cover/portrait.webp" />
  <link rel="preload" as="image" href="assets/tex/desk.webp" />
</head>
<body data-page="desk">
  <a class="skip" href="#moments">Skip to the photos</a>

  <!-- the opening: who, in one look -->
  <header class="deck" id="top">
    <div class="spot spot--deck" aria-hidden="true"></div>
    <img class="prop prop--camera" src="assets/props/camera.webp" width="749" height="801" alt="" aria-hidden="true" decoding="async" />
    <img class="prop prop--specs" src="assets/props/spectacles.webp" width="773" height="331" alt="" aria-hidden="true" decoding="async" />

    <div class="hero">
      <figure class="hero__photo">
        <span class="washi washi--a" aria-hidden="true"></span>
        <img id="heroPhoto" src="photos/cover/portrait.webp" width="760" height="950" alt="" fetchpriority="high" />
        <figcaption>me, UWC Costa Rica</figcaption>
      </figure>

      <div class="hero__card">
        <h1 class="hero__name" data-bind="name">Ulrich Mohrhardt Doger</h1>
        <p class="hero__line" data-bind="line"></p>
        <blockquote class="hero__thesis"><p id="thesis"></p></blockquote>
        <a class="hero__go" href="#moments" id="play"><span class="hand">this is what the essay couldn't fit</span><span class="hero__arrow" aria-hidden="true">↓</span></a>
      </div>

      <!-- the tape: decorative, its reels wind as you scroll -->
      <a class="cassette cassette--prop" id="cassette" href="#moments" aria-label="Start">
        <div class="cassette__shell">
          <span class="screw screw--tl"></span><span class="screw screw--tr"></span>
          <span class="screw screw--bl"></span><span class="screw screw--br"></span>
          <div class="label">
            <div class="label__holo" aria-hidden="true"></div>
            <div class="label__top"><div>
              <p class="label__title">My <span>Journey</span></p>
              <p class="label__sub">side A · 2025 — side B · 2027</p>
            </div></div>
            <div class="window">
              <div class="reel reel--l"><span class="reel__tape"></span><span class="reel__hub"><i></i></span></div>
              <div class="window__mid"><span class="window__ticks"></span><span class="window__nums"><i>100</i><i>50</i><i>0</i></span></div>
              <div class="reel reel--r"><span class="reel__tape"></span><span class="reel__hub"><i></i></span></div>
            </div>
            <div class="label__name"><span class="label__x">✕</span><span class="label__hand" data-bind="short">Ulrich</span></div>
            <span class="sticker-play">PLAY IT TO<br />KNOW ME MORE</span>
          </div>
          <div class="cassette__bottom"><span class="hole"></span><span class="screw screw--c"></span><span class="hole"></span></div>
          <span class="cassette__shine" aria-hidden="true"></span>
        </div>
      </a>
    </div>
  </header>

  <main class="table" id="moments">
    <!-- the maps lie on the desk like everything else -->
    <section class="spread spread--maps" aria-label="From Tehuacán to Costa Rica">
      <figure class="map map--flight">
        <div class="map__paper"><div class="map__area">
          <svg class="map__svg" id="flightSvg" viewBox="0 0 400 292" aria-hidden="true"></svg>
          <div class="map__pins" id="flightPins"></div>
        </div></div>
        <figcaption class="sr-only">Map of Mexico and Central America with the flight from Tehuacán, Puebla to Santa Ana, Costa Rica.</figcaption>
      </figure>
      <figure class="map map--cr">
        <div class="map__paper"><div class="map__area">
          <svg class="map__svg" id="mapSvg" viewBox="0 0 360 360" aria-hidden="true"></svg>
          <div class="map__pins" id="mapPins"></div>
        </div></div>
        <figcaption class="sr-only">Map of Costa Rica with the places in these photos marked.</figcaption>
      </figure>
      <p class="note note--map"><span class="note__meta" id="distance"></span><span class="note__hand">I left with one suitcase. These are the places that filled it back up.</span></p>
      <img class="prop prop--compass" src="assets/props/compass.webp" width="420" height="553" alt="" aria-hidden="true" decoding="async" loading="lazy" />
    </section>

    <!-- moments are rendered here from js/data.js -->
    <div id="flow"></div>

    <section class="spread spread--end" aria-label="A last note">
      <img class="prop prop--walkman" src="assets/props/walkman.webp" width="533" height="681" alt="" aria-hidden="true" decoding="async" loading="lazy" />
      <div class="letter">
        <span class="washi washi--b" aria-hidden="true"></span>
        <div id="letter"></div>
        <p class="letter__sig" data-bind="signature">— Ulrich</p>
      </div>
      <a class="rewind" href="#top" id="rewind"><span aria-hidden="true">⏪</span> rewind</a>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
