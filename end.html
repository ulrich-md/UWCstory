<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>To be continued — My Journey</title>
  <meta name="description" content="The travel log and liner notes of two years at UWC Costa Rica." />
  <meta name="theme-color" content="#121212" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='12' width='60' height='40' rx='6' fill='%23e9ecf2'/%3E%3Crect x='12' y='24' width='40' height='14' rx='7' fill='%231d2456'/%3E%3Ccircle cx='21' cy='31' r='5' fill='%23cfd4de'/%3E%3Ccircle cx='43' cy='31' r='5' fill='%23cfd4de'/%3E%3Crect x='16' y='44' width='32' height='4' fill='%23c8102e'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredoka:wght@500;600;700&family=Gochi+Hand&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="end">
  <main class="closed" aria-labelledby="closed-title">
    <div class="spot spot--closed" aria-hidden="true"></div>
    <nav class="topbar topbar--wall" aria-label="Journey">
      <a class="topbar__back" id="lastStop" href="stop.html"><span aria-hidden="true">←</span> Last stop</a>
      <a class="topbar__brand" href="index.html" data-bind="title">My Journey</a>
      <span class="topbar__count">SIDE B · END</span>
    </nav>
    <img class="prop prop--walkman" src="assets/props/walkman.webp" width="533" height="681" alt="" aria-hidden="true" decoding="async" />

    <div class="folder">
      <span class="folder__tab">JOURNEY · <b data-bind="years">2024 — 2026</b></span>
      <div class="folder__page">
        <h1 id="closed-title" class="typed">TRAVEL LOG</h1>
        <dl class="report" id="report"></dl>
        <p class="verdict" data-bind="nextStop">Next stop: university.</p>
        <span class="bigstamp" aria-hidden="true">TO BE CONTINUED</span>
      </div>
    </div>

    <div class="liner">
      <div class="liner__head">
        <span>SIDE B · LINER NOTES</span><span data-bind="years">2024 — 2026</span>
      </div>
      <h2 class="liner__h">Featuring</h2>
      <ul class="liner__cast" id="cast"></ul>
      <dl class="liner__credits" id="creditsList"></dl>
    </div>

    <a class="tbtn tbtn--rewind" href="index.html"><span aria-hidden="true">⏪</span> Rewind to the start</a>
  </main>

  <script src="js/data.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
